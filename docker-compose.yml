version: '3'

services:
  wiki:
    image: requarks/wiki:2
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: ${SERVICE_PASSWORD_WIKI}
      DB_NAME: wikijs
      PUID: 1000
      PGID: 1000
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - wiki-data:/wiki/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz >/dev/null 2>&1 && [ $(grep -c 'Z (zombie)' /proc/[0-9]*/stat 2>/dev/null || echo 0) -lt 100 ] || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wikijs
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_WIKI}
      POSTGRES_USER: wikijs
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wikijs"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  wiki-data:
  db-data:
